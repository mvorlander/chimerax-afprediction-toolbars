name: Build ChimeraX bundle wheel

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run smoke tests
        run: |
          python -m compileall src tests
          python tests/smoke_test_discovery.py
          python tests/smoke_test_missense.py

      - name: Build wheel
        run: |
          python tools/build_bundle_wheel.py
          ls -lh dist/*.whl

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: chimerax-afprediction-toolbars-wheel
          path: dist/*.whl
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.whl --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.whl \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --latest
          fi
